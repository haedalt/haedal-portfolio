name: Update site from Notion

on:
  # 매일 아침 6시(한국 시간)에 자동 실행
  schedule:
    - cron: '0 21 * * *'
  # Actions 탭에서 "Run workflow" 버튼으로 바로 실행
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update lectures from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: node scripts/build.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "변경 사항이 없습니다."
          else
            git commit -m "노션 강의 이력으로 사이트 갱신"
            git push
          fi
